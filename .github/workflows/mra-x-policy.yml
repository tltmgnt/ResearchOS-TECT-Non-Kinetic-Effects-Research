name: MRA-X offline policy
on:
  pull_request:
    paths:
      - 'tools/mra_x_tga.py'
      - '.github/workflows/mra-x-policy.yml'
  push:
    branches: [main]
    paths:
      - 'tools/mra_x_tga.py'
      - '.github/workflows/mra-x-policy.yml'
permissions:
  contents: read
jobs:
  offline-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify generic research policy only
        run: python3 tools/mra_x_tga.py --self-test
